services:
  - type: web
    name: fire-eye-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: REDIS_URL
        sync: false
      - key: ML_MODEL_PATH
        value: ml/models/risk_model.joblib
      - key: SUPABASE_URL
        value: https://xwiwmwgyayqyhkfiinnv.supabase.co
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: CORS_ALLOW_ORIGINS
        value: "*"
      - key: SEED_DEMO_DATA
        value: "false"

